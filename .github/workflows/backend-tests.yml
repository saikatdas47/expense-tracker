name: Backend tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: penny_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: penny_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U penny_test -d penny_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable runner-local credentials, never a production connection.
      TEST_DATABASE_URL: postgres://penny_test:disposable_ci_password@localhost:5432/penny_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
